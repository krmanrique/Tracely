version: '3.8'

services:
  # ── API Node.js ─────────────────────────────────────────────
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: tracely_api
    ports:
      - "3000:3000"
    env_file:
      - .env          # crear en el servidor a partir de .env.example — nunca se commitea
    environment:
      NODE_ENV: production
      DB_HOST: db          # nombre del servicio de base de datos
      DB_PORT: 5432
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  # ── PostgreSQL ───────────────────────────────────────────────
  db:
    image: postgres:15-alpine
    container_name: tracely_db
    ports:
      - "127.0.0.1:5432:5432"   # solo accesible desde el propio servidor (ej. pgAdmin por SSH tunnel)
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASS}
    volumes:
      - pgdata:/var/lib/postgresql/data
      # docker-entrypoint-initdb.d ejecuta los .sql en orden alfabetico, y
      # solo la primera vez que el volumen de datos esta vacio.
      - ./migration.sql:/docker-entrypoint-initdb.d/01-migration.sql
      - ./seed_data.sql:/docker-entrypoint-initdb.d/02-seed_data.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

volumes:
  pgdata:
    driver: local
